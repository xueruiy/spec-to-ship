<svg width="960" height="1000" viewBox="0 0 960 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-overview-title workflow-overview-desc">
<title id="workflow-overview-title">从需求到交付，再到当前知识</title>
<desc id="workflow-overview-desc">七阶段人工与 Agent 交接流程及产物：需求、设计、拆分、开发、测试、验收、知识同步；测试或验收的实现缺陷返回开发，开发的方案问题返回设计，需求问题及验收标准或范围变化返回需求澄清。</desc>
<defs>
  <marker id="workflow-overview-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #2d3142; }
    .name { font-size: 24px; font-weight: 600; }
    .detail, .label { font-size: 16px; fill: #4f5d75; }
    .flow { fill: none; stroke: #4f5d75; stroke-width: 1.2; marker-end: url(#workflow-overview-arrow); }
    .feedback { stroke-dasharray: 4 4; }
  </style>
</defs>
<rect width="960" height="1000" fill="#f5f5f5"/>
<text x="480" y="56" text-anchor="middle" font-size="28" font-family="'Songti SC', 'SimSun', 'Noto Serif CJK SC', Georgia, serif" style="font-family:'Songti SC','SimSun','Noto Serif CJK SC',Georgia,serif">从需求到交付，再到当前知识</text>
<text x="480" y="88" text-anchor="middle" class="detail">文档与模板阶段 · 由人和 Agent 遵循的交接约定</text>
<!-- 先绘制连接线；反馈路径各用独立端口与通道，避免交叉和遮挡。 -->
<path class="flow" d="M480 192 V224"/>
<path class="flow" d="M480 304 V336"/>
<path class="flow" d="M480 416 V448"/>
<path class="flow" d="M480 528 V560"/>
<path class="flow" d="M480 640 V672"/>
<path class="flow" d="M480 752 V784"/>
<path class="flow feedback" d="M352 520 H136 Q128 520 128 512 V160 Q128 152 136 152 H352"/>
<path class="flow feedback" d="M352 472 H248 Q240 472 240 464 V272 Q240 264 248 264 H352"/>
<path class="flow feedback" d="M608 584 H696 Q704 584 704 576 V488 Q704 480 696 480 H608"/>
<path class="flow feedback" d="M608 696 H760 Q768 696 768 688 V464 Q768 456 760 456 H608"/>
<path class="flow feedback" d="M352 736 H72 Q64 736 64 728 V136 Q64 128 72 128 H352"/>
<!-- 标签遮罩与线条保持 8px 间距，不跨入阶段卡片。 -->
<rect x="152" y="488" width="128" height="24" fill="#f5f5f5"/><text x="160" y="504" class="label">需求问题</text>
<rect x="248" y="352" width="96" height="24" fill="#f5f5f5"/><text x="256" y="368" class="label">方案问题</text>
<rect x="616" y="528" width="80" height="24" fill="#f5f5f5"/><text x="624" y="544" class="label">实现缺陷</text>
<rect x="776" y="616" width="136" height="24" fill="#f5f5f5"/><text x="784" y="632" class="label">验收：实现缺陷</text>
<rect x="72" y="648" width="264" height="24" fill="#f5f5f5"/><text x="80" y="664" class="label">验收：标准含糊／范围变化</text>
<g data-stage="1">
<rect x="352" y="112" width="256" height="80" rx="8" fill="#f5f5f5"/>
<rect x="352" y="112" width="256" height="80" rx="8" fill="#f9e9e1" stroke="#eb6c36" stroke-width="1.2"/>
<text x="480" y="144" text-anchor="middle" class="name">01 需求澄清</text>
<text x="480" y="172" text-anchor="middle" class="detail">PRD · R 需求 / AC 验收标准</text>
</g>
<g data-stage="2">
<rect x="352" y="224" width="256" height="80" rx="8" fill="#f5f5f5"/>
<rect x="352" y="224" width="256" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="480" y="256" text-anchor="middle" class="name">02 技术设计</text>
<text x="480" y="284" text-anchor="middle" class="detail">技术方案 · 需求映射与取舍</text>
</g>
<g data-stage="3">
<rect x="352" y="336" width="256" height="80" rx="8" fill="#f5f5f5"/>
<rect x="352" y="336" width="256" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="480" y="368" text-anchor="middle" class="name">03 任务拆分</text>
<text x="480" y="396" text-anchor="middle" class="detail">任务单 · T 任务与依赖</text>
</g>
<g data-stage="4">
<rect x="352" y="448" width="256" height="80" rx="8" fill="#f5f5f5"/>
<rect x="352" y="448" width="256" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="480" y="480" text-anchor="middle" class="name">04 开发实施</text>
<text x="480" y="508" text-anchor="middle" class="detail">代码 + 任务单实施记录</text>
</g>
<g data-stage="5">
<rect x="352" y="560" width="256" height="80" rx="8" fill="#f5f5f5"/>
<rect x="352" y="560" width="256" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="480" y="592" text-anchor="middle" class="name">05 测试验证</text>
<text x="480" y="620" text-anchor="middle" class="detail">测试文档 · TC 用例与证据</text>
</g>
<g data-stage="6">
<rect x="352" y="672" width="256" height="80" rx="8" fill="#f5f5f5"/>
<rect x="352" y="672" width="256" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text x="480" y="704" text-anchor="middle" class="name">06 产品验收</text>
<text x="480" y="732" text-anchor="middle" class="detail">验收记录 · 逐项对照 AC</text>
</g>
<g data-stage="7">
<rect x="352" y="784" width="256" height="80" rx="8" fill="#f5f5f5"/>
<rect x="352" y="784" width="256" height="80" rx="8" fill="#f9e9e1" stroke="#eb6c36" stroke-width="1.2"/>
<text x="480" y="816" text-anchor="middle" class="name">07 收尾与知识同步</text>
<text x="480" y="844" text-anchor="middle" class="detail">收尾记录 + 当前模块知识</text>
</g>
<text x="480" y="900" text-anchor="middle" class="detail">知识按需更新已有权威文档；归档不授予推送、发布或部署权限。</text>
<line x1="40" y1="924" x2="920" y2="924" stroke="#bfc0c0" stroke-width="0.8"/>
<path d="M64 956 H112" class="flow"/><text x="128" y="960" class="detail">满足完成条件后交接</text>
<path d="M400 956 H448" class="flow feedback"/><text x="464" y="960" class="detail">反馈修正后重新验证</text>
<text x="920" y="960" text-anchor="end" class="detail">依据：workflow.md</text>
</svg>
