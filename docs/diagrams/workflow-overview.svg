<text x="480" y="480" text-anchor="middle" class="name">04 开发与测试</text>
<text x="480" y="508" text-anchor="middle" class="detail">implement + tdd</text>
</g>
<g data-stage="5">
<rect x="352" y="560" width="256" height="80" rx="8" fill="#f5f5f5"/>
