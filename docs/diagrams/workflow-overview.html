<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>spec-to-ship 入口选择</title><style>body{margin:0;background:#f5f5f5}main{max-width:960px;margin:auto}svg{display:block;width:100%;height:auto}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" width="960" height="1088" viewBox="0 0 960 1088" role="img" aria-labelledby="workflow-overview-title workflow-overview-desc">
<title id="workflow-overview-title">从这轮任务选择入口</title>
<desc id="workflow-overview-desc">统一入口核对目标、材料和授权：只测试、审查、验收或暂停时在该范围结束；目标不清先澄清，明确改动可实施，已有异常先复现诊断；恢复任务先核对当前版本与旧证据。</desc>

.title{font-family:'Songti SC',Georgia,serif;font-size:32px}.name{font-size:24px;font-weight:600}.question{font-size:20px;font-weight:600}.sub{font-size:16px;fill:#4f5d75}
.arrow{fill:none;stroke:#4f5d75;stroke-width:1.2;marker-end:url(#workflow-overview-arrow)}
</style>

<text x="208" y="896" text-anchor="middle" class="sub">需要时 implement；拆票按需</text>
<rect x="592" y="800" width="320" height="128" rx="8" fill="#ffffff" stroke="#4f5d75"/>
<text x="752" y="836" text-anchor="middle" class="name">诊断与验证</text>
<text x="752" y="868" text-anchor="middle" class="sub">diagnosing-bugs · 核实原因</text>
<text x="752" y="896" text-anchor="middle" class="sub">只诊断不默认修复</text>
