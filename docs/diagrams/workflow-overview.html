<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>spec-to-ship 使用导航</title><style>body{margin:0;background:#f5f5f5}main{max-width:960px;margin:auto}svg{display:block;width:100%;height:auto}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 944" role="img" aria-labelledby="workflow-overview-title workflow-overview-desc">

<rect width="960" height="944" fill="#f5f5f5"/>
<text x="480" y="56" text-anchor="middle" class="title">按任务进入研发循环，按证据完成交付</text>
<text x="480" y="92" text-anchor="middle" class="sub">复用已有结论与产物 · 由用户选择入口 · 不强制逐项调用</text>

<text x="776" y="492" text-anchor="middle" class="sub">项目回归 + code-review</text>
